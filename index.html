<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171a1e">
<title>R7 SYSTEM</title>
<style>
:root {
  --bg:#171a1e;
  --panel:#20252a;
  --panel2:#292f35;
  --line:#424b53;
  --white:#f0f2f4;
  --muted:#89939d;
  --green:#4bd590;
  --yellow:#e9ca4d;
  --red:#ed625c;
  --blue:#38bce8;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;width:100vw;display:flex;flex-direction:column}
header{height:49px;flex-shrink:0;border-bottom:1px solid #353c43;display:flex;align-items:center;justify-content:space-between;padding:0 17px}
.logo{font-size:19px;font-weight:950;letter-spacing:3px}
.logo small{font-size:8px;display:block;color:var(--muted);letter-spacing:3px;margin-top:2px}
.status{font-size:9px;letter-spacing:2px;color:var(--green);border:1px solid var(--green);padding:7px 12px;border-radius:3px}
main{flex:1;min-height:0;position:relative}
#home{height:100%;display:flex;flex-direction:column;padding:9px 15px 7px}
.heading{font-size:11px;font-weight:bold;color:var(--muted);letter-spacing:3px;margin-bottom:8px}
#keypad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px 12px}
.key{
 --c:var(--green);
 position:relative;
 border:1.5px solid var(--c);
 background:linear-gradient(145deg,#252b30,#1d2227);
 border-radius:5px;
 display:flex;align-items:center;
 padding:7px 17px;
 gap:15px;
 text-align:left;
 min-width:0;
 box-shadow:inset 0 0 0 2px #15191d,0 2px 5px #0005;
}
.key:active{background:#333b42;transform:scale(.99)}
.key:before{
 content:"";
 position:absolute;
 right:-5px;top:13px;
 height:9px;width:9px;
 border-radius:50%;
 background:var(--bg);
 border:1.5px solid var(--c);
}
.key:after{
 content:"";
 position:absolute;left:0;top:9px;bottom:9px;width:3px;
 background:var(--c);
 opacity:.8;
}
.symbol{
 width:41px;height:41px;flex-shrink:0;
 display:grid;place-items:center;
 color:var(--c);
 border:1px solid var(--c);
 border-radius:4px;
 font-size:23px;font-weight:bold;
}
.keytext{min-width:0}
.keytext strong{display:block;font-size:12px;letter-spacing:2px}
.keytext small{display:block;font-size:8px;color:var(--muted);margin-top:5px;letter-spacing:1px}
.keycode{position:absolute;right:13px;bottom:8px;color:#64707a;font-size:8px;letter-spacing:1px}
#home footer{text-align:center;color:#68727b;font-size:8px;letter-spacing:3px;padding-top:7px}

/* MODULE DISPLAY */

#screen{height:100%;display:none;flex-direction:column}
.modulebar{height:43px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:12px}
.back{background:#252b30;border:1px solid var(--line);height:30px;width:38px;border-radius:3px;font-size:18px}
.modulebar strong{font-size:12px;letter-spacing:2px}
.modulebar small{color:var(--muted);font-size:8px;margin-left:auto;letter-spacing:2px}
#content{flex:1;min-height:0;padding:10px 13px;display:flex;flex-direction:column;gap:9px}
.sectionlabel{font-size:9px;font-weight:bold;letter-spacing:2px;color:var(--muted)}
.metrics{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center}
.metric:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent,var(--green))}
.metric label{font-size:9px;color:var(--muted);font-weight:bold;letter-spacing:1.5px}
.metric strong{font-size:clamp(22px,4vw,43px);font-weight:950;margin-top:5px;white-space:nowrap}
.metric small{font-size:9px;color:var(--muted);margin-top:4px}
.metric.big{grid-column:span 2}
.metric.big strong{font-size:clamp(38px,7vw,75px)}
.bottomline{height:31px;flex-shrink:0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:8px;color:var(--muted);letter-spacing:1px}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.blue{color:var(--blue)}
.controls{display:flex;gap:8px}
.ctrl{background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:3px;font-size:9px;letter-spacing:1px;font-weight:bold}
.ctrl.green{border-color:var(--green);color:var(--green)}
.ctrl.red{border-color:var(--red);color:var(--red)}
.chart{height:85px;background:var(--panel);border:1px solid var(--line);border-radius:4px;width:100%}
@media (orientation:portrait){
 #home{padding:8px}
 #keypad{grid-template-columns:repeat(3,1fr);gap:6px}
 .key{padding:4px;justify-content:center;flex-direction:column;gap:5px}
 .symbol{width:32px;height:32px;font-size:18px}
 .keytext{text-align:center}
 .keytext strong{font-size:8px}
 .keytext small{display:none}
 .keycode{display:none}
}
@media(max-height:430px) and (orientation:landscape){
 header{height:39px}
 #home{padding:6px 12px}
 .heading{margin-bottom:5px}
 #keypad{gap:5px 9px}
 .key{padding:4px 12px;gap:10px}
 .symbol{width:32px;height:32px;font-size:18px}
 .keytext strong{font-size:10px}
 .keytext small{font-size:7px;margin-top:3px}
 .modulebar{height:35px}
 #content{padding:7px 10px;gap:5px}
 .metric{padding:6px 9px}
 .bottomline{height:23px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo">R7 SYSTEM<small>RENAULT CLIO V · PERFORMANCE</small></div>
 <div class="status" id="status">SIMULATION</div>
</header>

<main>
<!-- BOTONERA INICIAL -->
<section id="home">
 <div class="heading">01 / SYSTEM CONTROL</div>
 <div id="keypad">

  <button class="key" style="--c:var(--green)" onclick="openPage('main')">
   <span class="symbol">▦</span>
   <span class="keytext"><strong>MAIN</strong><small>VEHICLE STATUS</small></span><span class="keycode">01</span>
  </button>

  <button class="key" style="--c:var(--yellow)" onclick="openPage('engine')">
   <span class="symbol">♨</span>
   <span class="keytext"><strong>ENGINE</strong><small>ENGINE CONTROL</small></span><span class="keycode">02</span>
  </button>

  <button class="key" style="--c:var(--yellow)" onclick="openPage('pressure')">
   <span class="symbol">◉</span>
   <span class="keytext"><strong>PRESSURE</strong><small>PRESSURE MONITOR</small></span><span class="keycode">03</span>
  </button>

  <button class="key" style="--c:var(--blue)" onclick="openPage('gforce')">
   <span class="symbol">⌖</span>
   <span class="keytext"><strong>G-FORCE</strong><small>ACCELERATION</small></span><span class="keycode">04</span>
  </button>

  <button class="key" style="--c:var(--red)" onclick="openPage('record')">
   <span class="symbol">●</span>
   <span class="keytext"><strong>RECORD</strong><small>STAGE RECORDING</small></span><span class="keycode">05</span>
  </button>

  <button class="key" style="--c:var(--blue)" onclick="openPage('analysis')">
   <span class="symbol">▥</span>
   <span class="keytext"><strong>ANALYSIS</strong><small>DATA REVIEW</small></span><span class="keycode">06</span>
  </button>

  <button class="key" style="--c:var(--red)" onclick="openPage('diagnostics')">
   <span class="symbol">⚙</span>
   <span class="keytext"><strong>DIAGNOSTICS</strong><small>ECU / FAULTS</small></span><span class="keycode">07</span>
  </button>

  <button class="key" style="--c:var(--blue)" onclick="openPage('gps')">
   <span class="symbol">⌖</span>
   <span class="keytext"><strong>GPS</strong><small>POSITION / STAGE</small></span><span class="keycode">08</span>
  </button>

  <button class="key" style="--c:var(--green)" onclick="openPage('settings')">
   <span class="symbol">☷</span>
   <span class="keytext"><strong>SETTINGS</strong><small>SYSTEM CONFIG</small></span><span class="keycode">09</span>
  </button>

 </div>
 <footer>R7 PERFORMANCE · CONTROL INTERFACE</footer>
</section>

<!-- PANTALLAS INDIVIDUALES -->
<section id="screen">
 <div class="modulebar">
  <button class="back" onclick="goHome()">←</button>
  <strong id="title">MAIN</strong>
  <small>R7 / CLIO V</small>
 </div>
 <div id="content"></div>
 <div class="bottomline">
  <span>R7 PERFORMANCE SYSTEM</span>
  <span id="source">SIMULATION DATA</span>
 </div>
</section>
</main>
</div>

<script>
const names={
 main:"MAIN / VEHICLE STATUS",
 engine:"ENGINE / TEMPERATURE",
 pressure:"PRESSURE / MONITOR",
 gforce:"G-FORCE / ACCELERATION",
 record:"RECORD / STAGE",
 analysis:"ANALYSIS / TELEMETRY",
 diagnostics:"DIAGNOSTICS / ECU",
 gps:"GPS / POSITION",
 settings:"SETTINGS / SYSTEM"
};

const templates={
 main:[
  ["SPEED","113","KM/H","big","--green"],
  ["ENGINE RPM","5152","RPM","","--yellow"],
  ["GEAR","4","MANUAL","","--blue"],
  ["THROTTLE","78","%","","--green"],
  ["ENGINE LOAD","72","%","","--yellow"],
  ["VOLTAGE","14.2","V","","--green"],
  ["COOLANT","91","°C","","--green"]
 ],
 engine:[
  ["COOLANT TEMP.","91","°C","","--green"],
  ["INTAKE AIR","32","°C","","--green"],
  ["OIL TEMP.","---","°C","", "--yellow"],
  ["OIL PRESSURE","---","BAR","","--red"],
  ["ENGINE RPM","5152","RPM","","--yellow"],
  ["ENGINE LOAD","72","%","","--green"],
  ["VOLTAGE","14.2","V","","--blue"],
  ["IGNITION","ACTIVE","","","--green"]
 ],
 pressure:[
  ["TURBO BOOST","1.12","BAR REL.","","--yellow"],
  ["MAP","2.13","BAR ABS.","","--blue"],
  ["ATMOSPHERIC","1.01","BAR","","--green"],
  ["FUEL PRESSURE","---","BAR","","--yellow"],
  ["OIL PRESSURE","---","BAR","","--red"],
  ["TYRE PRESSURE","---","BAR","","--blue"],
  ["BRAKE PRESSURE","---","BAR","","--yellow"],
  ["INTAKE VACUUM","---","BAR","","--green"]
 ],
 gforce:[
  ["LONGITUDINAL","0.72","G","","--blue"],
  ["LATERAL","-0.48","G","","--green"],
  ["MAXIMUM","1.24","G","","--yellow"],
  ["GPS SPEED","113","KM/H","","--blue"],
  ["ACCELERATION","ACTIVE","","","--green"],
  ["SENSOR","PHONE","","","--yellow"],
  ["CALIBRATION","PENDING","","","--red"],
  ["RECORDING","READY","","","--green"]
 ],
 record:[
  ["STAGE TIME","00:00","MIN","big","--red"],
  ["SAMPLES","0","POINTS","","--green"],
  ["DISTANCE","0.00","KM","","--blue"],
  ["MAX SPEED","---","KM/H","","--yellow"],
  ["MAX RPM","---","RPM","","--yellow"],
  ["STATUS","READY","","","--green"],
  ["GPS","OFF","","","--blue"]
 ],
 analysis:[
  ["SESSIONS","0","SAVED","","--green"],
  ["DISTANCE","---","KM","","--blue"],
  ["MAX SPEED","---","KM/H","","--yellow"],
  ["MAX RPM","---","RPM","","--yellow"],
  ["COMPARISON","READY","","","--green"],
  ["CSV","EXPORT","","","--blue"],
  ["TELEMETRY","READY","","","--green"]
 ],
 diagnostics:[
  ["CONNECTION","OFFLINE","","","--red"],
  ["PROTOCOL","UNKNOWN","","","--yellow"],
  ["DTC CODES","---","CODES","","--red"],
  ["ECU","WAITING","","","--blue"],
  ["ADAPTER","UNKNOWN","","","--yellow"],
  ["LIVE DATA","PENDING","","","--green"]
 ],
 gps:[
  ["GPS SPEED","113","KM/H","big","--blue"],
  ["LATITUDE","---","DEGREES","","--green"],
  ["LONGITUDE","---","DEGREES","","--green"],
  ["ACCURACY","---","METRES","","--yellow"],
  ["DISTANCE","0.00","KM","","--blue"],
  ["SATELLITES","---","GPS","","--green"],
  ["POSITION","PENDING","","","--yellow"]
 ],
 settings:[
  ["SYSTEM","R7 V1","","","--green"],
  ["VEHICLE","CLIO V","","","--blue"],
  ["DATABASE","LOCAL","","","--green"],
  ["EXPORT","CSV","","","--blue"],
  ["OBD2","PENDING","","","--yellow"],
  ["DISPLAY","LANDSCAPE","","","--green"],
  ["STORAGE","READY","","","--green"]
 ]
};

let timer=null;
let seconds=0;
let recording=false;

function openPage(id){
 document.getElementById("home").style.display="none";
 document.getElementById("screen").style.display="flex";
 document.getElementById("title").textContent=names[id];
 document.getElementById("source").textContent="SIMULATION DATA";

 const content=document.getElementById("content");
 const data=templates[id]||[];

 content.innerHTML=`
  <div class="sectionlabel">LIVE PARAMETERS / ${id.toUpperCase()}</div>
  <div class="metrics">
   ${data.map((item,i)=>`
    <div class="metric ${item[3]||""}" style="--accent:var(${item[4]?.replace("--","--")||"--green"})">
     <label>${item[0]}</label>
     <strong id="v${i}">${item[1]}</strong>
     <small>${item[2]}</small>
    </div>
   `).join("")}
  </div>
  ${id==="record"?`
   <div class="controls">
    <button class="ctrl green" onclick="start()">● START</button>
    <button class="ctrl red" onclick="stop()">■ STOP</button>
   </div>`:""}
  ${id==="analysis"?`
   <div class="controls">
    <button class="ctrl green" onclick="alert('El reproductor de telemetría se incorporará en la versión de análisis.')">OPEN REPLAY</button>
    <button class="ctrl" onclick="alert('No hay sesiones guardadas en este prototipo visual.')">SESSIONS</button>
   </div>`:""}
 `;
}

function goHome(){
 document.getElementById("screen").style.display="none";
 document.getElementById("home").style.display="flex";
}

function start(){
 recording=true;
 seconds=0;
 clearInterval(timer);
 timer=setInterval(()=>{
  if(!recording)return;
  seconds++;
  const el=document.getElementById("v0");
  if(el)el.textContent=
   String(Math.floor(seconds/60)).padStart(2,"0")+":"+
   String(seconds%60).padStart(2,"0");
 },1000);
}

function stop(){
 recording=false;
 clearInterval(timer);
}
</script>
</body>
</html>
