<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Clio V Rally Spec Dash</title>
    <style>
        :root {
            --bg-color: #040507;
            --panel-bg: #0b0e14;
            --panel-border: #1a202c;
            --accent-green: #00ff66;
            --accent-yellow: #ffb700;
            --accent-red: #ff1e38;
            --accent-cyan: #00f0ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        /* Splash overlay opcional de 1 segundo sin JS bloqueante */
        #splash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            animation: fadeOutSplash 1s forwards 1.2s; pointer-events: none;
        }
        @keyframes fadeOutSplash { to { opacity: 0; visibility: hidden; } }

        /* Rombo Renault Minimalista */
        .rhombus-container { width: 50px; height: 50px; position: relative; margin-bottom: 12px; }
        .rhombus {
            position: absolute; width: 30px; height: 30px; border: 2px solid var(--accent-cyan);
            transform: rotate(45deg); left: 10px; top: 10px;
            box-shadow: 0 0 15px rgba(0,240,255,0.4);
        }
        
        header {
            background: var(--panel-bg); border-bottom: 1px solid var(--panel-border);
            padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand-tag { font-size: 11px; font-weight: 900; color: var(--text-muted); letter-spacing: 2px; }
        .brand-tag span { color: var(--accent-red); }
        .status-pill {
            display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 800;
            background: #040608; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--panel-border);
        }
        .led-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }

        nav { display: flex; background: #020305; border-bottom: 1px solid var(--panel-border); }
        .nav-btn {
            flex: 1; padding: 10px 0; text-align: center; font-size: 9px; font-weight: 900;
            color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.04); }

        main { flex: 1; padding: 8px; overflow-y: auto; }
        .tab-content { display: none; height: 100%; flex-direction: column; gap: 8px; }
        .tab-content.active { display: flex; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }

        .card {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-full { grid-column: span 2; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .card-body { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 2px 0; }
        .value { font-size: 40px; font-weight: 900; font-family: monospace; color: #ffffff; letter-spacing: -1px; }
        .unit { font-size: 11px; font-weight: 800; color: var(--text-muted); }

        /* Shift Lights Secuenciales de LEDs Físicos */
        .shift-lights { display: flex; gap: 4px; margin-top: 4px; width: 100%; }
        .shift-led { flex: 1; height: 10px; background: #131722; border-radius: 2px; }
        .shift-led.green.on { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .shift-led.yellow.on { background: var(--accent-yellow); box-shadow: 0 0 10px var(--accent-yellow); }
        .shift-led.red.on { background: var(--accent-red); box-shadow: 0 0 12px var(--accent-red); }
        .shift-led.blink { background: #ffffff !important; box-shadow: 0 0 16px #ffffff !important; }

        /* G-Meter */
        .g-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .g-circle { width: 130px; height: 130px; border-radius: 50%; border: 1px dashed var(--panel-border); position: relative; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); }
        .g-cross-h { position: absolute; width: 100%; height: 1px; background: var(--panel-border); }
        .g-cross-v { position: absolute; height: 100%; width: 1px; background: var(--panel-border); }
        .g-ball { width: 12px; height: 12px; background: var(--accent-cyan); border-radius: 50%; position: absolute; box-shadow: 0 0 10px var(--accent-cyan); transition: transform 0.05s linear; }

        .btn-connect {
            width: 100%; padding: 12px; background: var(--accent-cyan); color: #000;
            border: none; border-radius: 6px; font-weight: 900; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="rhombus-container">
            <div class="rhombus"></div>
        </div>
        <div style="font-size: 14px; font-weight: 900; letter-spacing: 4px; color: #fff;">RENAULT SPORT</div>
        <div style="font-size: 9px; font-weight: 700; color: var(--accent-cyan); letter-spacing: 2px; margin-top: 4px;">CLIO V RALLY 7</div>
    </div>

    <header>
        <div class="brand-tag">CLIO V <span>RALLY 7</span></div>
        <div class="status-pill">
            <div class="led-dot"></div>
            <span>SIMULACIÓN TELEMETRÍA</span>
        </div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('main', event)">General</button>
        <button class="nav-btn" onclick="switchTab('turbo', event)">Turbo / Engine</button>
        <button class="nav-btn" onclick="switchTab('gforce', event)">G-Meter</button>
    </nav>

            <div class="grid-2">
                <div class="card card-full">
                    <div class="card-header"><span class="card-title">Tacómetro (RPM)</span></div>

                        <div class="shift-led green" id="led-1"></div>
                        <div class="shift-led green" id="led-2"></div>
                        <div class="shift-led yellow" id="led-3"></div>
                        <div class="shift-led yellow" id="led-4"></div>
                        <div class="shift-led red" id="led-5"></div>
                        <div class="shift-led red" id="led-6"></div>
                        <div class="shift-led red" id="led-7"></div>
                        <div class="shift-led red" id="led-8"></div>
                    </div>
                </div>
