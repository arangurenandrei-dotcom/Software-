
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>R7 SYSTEM</title>
<style>
:root {
  --bg:#101214; --panel:#191d20; --panel2:#202529;
  --line:#343c40; --text:#e8edef; --muted:#879399;
  --green:#65e6a0; --yellow:#f4ce61; --red:#ff6262;
  --blue:#65baff; --orange:#ff9c55;
}
* {box-sizing:border-box}
html,body {
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body {user-select:none}
button {font:inherit;color:inherit;cursor:pointer}
#app {height:100dvh;width:100vw;display:flex;flex-direction:column}
.topbar {
  height:42px;min-height:42px;padding:0 17px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);background:#141719;
}
.brand {font-size:17px;font-weight:900;letter-spacing:3px}
.brand span {color:var(--green)}
.topinfo {display:flex;align-items:center;gap:15px;font-size:10px;color:var(--muted);letter-spacing:1px}
.dot {display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-right:5px}
#main {flex:1;min-height:0;position:relative;padding:12px}
.screen {display:none;width:100%;height:100%;min-height:0}
.screen.active {display:flex;flex-direction:column}
.homegrid {
  width:100%;height:100%;display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;
}
.tile {
  background:linear-gradient(145deg,#202629,#171b1e);
  border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:5px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;
  position:relative;overflow:hidden;
}
.tile:active {background:#30393e}
.tile .symbol {font-size:clamp(22px,4vw,39px);font-weight:900;color:var(--accent)}
.tile .name {font-size:clamp(12px,1.7vw,17px);font-weight:900;letter-spacing:2px}
.tile .sub {font-size:9px;color:var(--muted);letter-spacing:1px}
.tile .status {position:absolute;top:10px;right:11px;font-size:8px;color:var(--muted)}
.module-head {
  display:flex;align-items:center;justify-content:space-between;
  min-height:43px;border-bottom:1px solid var(--line);margin-bottom:10px;
}
.module-title {font-size:19px;font-weight:900;letter-spacing:2px}
.module-actions {display:flex;gap:8px;align-items:center}
.btn {
  background:#252c30;border:1px solid #424c51;padding:9px 13px;
  border-radius:3px;font-size:10px;font-weight:800;letter-spacing:1px;
}
.btn:active {background:#3a464c}
.btn.green {border-color:var(--green);color:var(--green)}
.btn.red {border-color:var(--red);color:var(--red)}
.btn.blue {border-color:var(--blue);color:var(--blue)}
.back {font-size:11px;color:var(--muted);background:none;border:0;padding:8px}
.content {flex:1;min-height:0;overflow:auto}
.cards {
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;height:100%;grid-auto-rows:minmax(85px,1fr);
}
.metric {
  background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:12px;display:flex;flex-direction:column;
  justify-content:space-between;min-height:80px;
}
.metric .label {font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:bold}
.metric .value {font-size:clamp(22px,4vw,39px);font-weight:900;font-variant-numeric:tabular-nums}
.metric .unit {font-size:10px;color:var(--muted)}
.na {color:#657178!important;font-size:20px!important}
.accent-green {border-top:2px solid var(--green)}
.accent-yellow {border-top:2px solid var(--yellow)}
.accent-blue {border-top:2px solid var(--blue)}
.accent-red {border-top:2px solid var(--red)}
.two-col {display:grid;grid-template-columns:1.3fr 1fr;gap:10px;height:100%}
.panel {background:var(--panel);border:1px solid var(--line);padding:12px;min-height:0}
.panel-title {font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px}
.big-number {font-size:clamp(35px,7vw,70px);font-weight:900}
.statusline {display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #30383c;font-size:11px}
.statusline span:last-child {color:var(--muted)}
.progress {height:5px;background:#30383c;margin-top:8px}
.progress div {height:100%;width:0;background:var(--green)}
.record-center {height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
.record-clock {font-size:clamp(42px,9vw,85px);font-weight:900;font-variant-numeric:tabular-nums}
.record-state {font-size:11px;letter-spacing:2px;color:var(--yellow)}
.record-controls {display:flex;gap:10px}
.record-button {padding:16px 25px;border:1px solid var(--green);color:var(--green);background:#18231e;font-weight:900;letter-spacing:2px;border-radius:3px}
.record-button.stop {border-color:var(--red);color:var(--red);background:#281b1b}
.data-table {width:100%;border-collapse:collapse;font-size:11px}
.data-table th,.data-table td {padding:11px 8px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th {color:var(--muted);font-size:9px;letter-spacing:1px}
input,select {background:#101416;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:3px}
.setting {display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}
.notice {padding:10px;border:1px solid #65562d;background:#292518;color:var(--yellow);font-size:10px;line-height:1.5;margin-bottom:10px}
.footer {height:23px;min-height:23px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:8px;letter-spacing:1px;color:#68757b}
.hidden {display:none!important}
@media (orientation:portrait) {
  .homegrid {grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
  .tile .name {font-size:10px}
  .cards {grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(70px,1fr)}
  .two-col {grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">R7 <span>SYSTEM</span></div>
    <div class="topinfo">
      <span id="connection"><i class="dot"></i>OBD DESCONECTADO</span>
      <span id="clock">--:--:--</span>
      <span>V1.0</span>
    </div>
  </header>

  <main id="main">
    <section id="home" class="screen active">
      <div class="homegrid">
        <button class="tile" style="--accent:var(--green)" onclick="openModule('main')">
          <span class="status">01</span><span class="symbol">◉</span><span class="name">MAIN</span><span class="sub">VEHICLE STATUS</span>
        </button>
        <button class="tile" style="--accent:var(--red)" onclick="openModule('engine')">
          <span class="status">02</span><span class="symbol">♨</span><span class="name">ENGINE</span><span class="sub">TEMPERATURE</span>
        </button>
        <button class="tile" style="--accent:var(--yellow)" onclick="openModule('pressure')">
          <span class="status">03</span><span class="symbol">◌</span><span class="name">PRESSURE</span><span class="sub">BOOST / PRESSURE</span>
        </button>
        <button class="tile" style="--accent:var(--blue)" onclick="openModule('gforce')">
          <span class="status">04</span><span class="symbol">✣</span><span class="name">G-FORCE</span><span class="sub">ACCELERATION</span>
        </button>
        <button class="tile" style="--accent:var(--red)" onclick="openModule('record')">
          <span class="status">05</span><span class="symbol">⏺</span><span class="name">RECORD</span><span class="sub">STAGE RECORDING</span>
        </button>
        <button class="tile" style="--accent:var(--green)" onclick="openModule('analysis')">
          <span class="status">06</span><span class="symbol">▥</span><span class="name">ANALYSIS</span><span class="sub">DATA / PLAYBACK</span>
        </button>
        <button class="tile" style="--accent:var(--orange)" onclick="openModule('diagnostics')">
          <span class="status">07</span><span class="symbol">⚠</span><span class="name">DIAGNOSTICS</span><span class="sub">ECU / ERRORS</span>
        </button>
        <button class="tile" style="--accent:var(--blue)" onclick="openModule('gps')">
          <span class="status">08</span><span class="symbol">⌖</span><span class="name">GPS</span><span class="sub">POSITION / ROUTE</span>
        </button>
        <button class="tile" style="--accent:#b4a1ff" onclick="openModule('settings')">
          <span class="status">09</span><span class="symbol">⚙</span><span class="name">SETTINGS</span><span class="sub">SYSTEM CONFIG</span>
        </button>
      </div>
    </section>

    <section id="module" class="screen">
      <div class="module-head">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="back" onclick="goHome()">◀ HOME</button>
          <div class="module-title" id="moduleTitle">MAIN</div>
        </div>
        <div class="module-actions"><span id="moduleStatus" style="font-size:9px;color:var(--muted)">NO DATA</span></div>
      </div>
      <div class="content" id="moduleContent"></div>
    </section>
  </main>

  <footer class="footer">
    <span>R7 PERFORMANCE · CLIO V</span>
    <span id="footerState">SYSTEM READY · NO ECU DATA</span>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const state = {
  connected:false, recording:false, startedAt:0, elapsed:0,
  currentModule:'', sessionSamples:[], sessions:[],
  liveData:{}, gps:null, demo:false, timer:null
};

const titles = {
  main:'MAIN / VEHICLE STATUS',
  engine:'ENGINE / TEMPERATURE',
  pressure:'PRESSURE / BOOST',
  gforce:'G-FORCE / DYNAMICS',
  record:'RECORD / STAGE',
  analysis:'ANALYSIS / TELEMETRY',
  diagnostics:'DIAGNOSTICS / ECU',
  gps:'GPS / POSITION',
  settings:'SETTINGS / CONFIGURATION'
};

function openModule(name) {
  state.currentModule=name;
  $('home').classList.remove('active');
  $('module').classList.add('active');
  $('moduleTitle').textContent=titles[name];
  renderModule(name);
}
function goHome() {
  $('module').classList.remove('active');
  $('home').classList.add('active');
}
function metric(label,value,unit='',accent='') {
  const unavailable=value===null || value===undefined || value==='N/A';
  return `<div class="metric ${accent}">
    <div class="label">${label}</div>
    <div class="value ${unavailable?'na':''}">${unavailable?'N/A':value}</div>
    <div class="unit">${unavailable?'NO DATA':unit}</div>
  </div>`;
}
function renderModule(name) {
  const d=state.liveData;
  const content=$('moduleContent');
  $('moduleStatus').textContent=state.connected?'CONNECTED':'NO DATA';
  if(name==='main') {
    content.innerHTML=`<div class="cards">
      ${metric('VEHICLE SPEED',d.speed,'KM/H','accent-green')}
      ${metric('ENGINE RPM',d.rpm,'RPM','accent-green')}
      ${metric('GEAR',d.gear,'GEAR','accent-blue')}
      ${metric('THROTTLE',d.throttle,'PERCENT','accent-yellow')}
      ${metric('ENGINE LOAD',d.load,'PERCENT')}
      ${metric('BATTERY VOLTAGE',d.voltage,'V','accent-blue')}
    </div>`;
  }
  if(name==='engine') {
    content.innerHTML=`<div class="cards">
      ${metric('COOLANT TEMP',d.coolant,'°C','accent-red')}
      ${metric('OIL TEMP',d.oilTemp,'°C','accent-red')}
      ${metric('INTAKE TEMP',d.intake,'°C','accent-yellow')}
      ${metric('OIL PRESSURE',d.oilPressure,'BAR','accent-yellow')}
      ${metric('ENGINE LOAD',d.load,'%')}
      ${metric('ENGINE RPM',d.rpm,'RPM')}
    </div>`;
  }
  if(name==='pressure') {
    content.innerHTML=`<div class="cards">
      ${metric('INTAKE MAP',d.map,'KPA','accent-yellow')}
      ${metric('BOOST PRESSURE',d.boost,'BAR','accent-yellow')}
      ${metric('FUEL PRESSURE',d.fuelPressure,'KPA')}
      ${metric('OIL PRESSURE',d.oilPressure,'BAR')}
      ${metric('INTAKE TEMP',d.intake,'°C')}
      ${metric('TYRE PRESSURE','N/A','EXTERNAL SENSOR')}
    </div>`;
  }
  if(name==='gforce') {
    const g=state.liveData.gforce||{};
    content.innerHTML=`<div class="cards">
      ${metric('LONGITUDINAL G',g.x,'G','accent-blue')}
      ${metric('LATERAL G',g.y,'G','accent-blue')}
      ${metric('VERTICAL G',g.z,'G')}
      ${metric('MAX LATERAL','N/A','G')}
      ${metric('MAX BRAKING','N/A','G')}
      ${metric('MAX ACCELERATION','N/A','G')}
    </div>`;
  }
  if(name==='record') renderRecord(content);
  if(name==='analysis') renderAnalysis(content);
  if(name==='diagnostics') renderDiagnostics(content);
  if(name==='gps') renderGPS(content);
  if(name==='settings') renderSettings(content);
}
function renderRecord(el) {
  el.innerHTML=`<div class="record-center">
    <div class="record-state" id="recordState">${state.recording?'● RECORDING':'READY TO RECORD'}</div>
    <div class="record-clock" id="recordClock">${formatTime(state.elapsed)}</div>
    <div style="font-size:10px;color:var(--muted)">SESSION ${state.sessions.length+1} · LOCAL STORAGE</div>
    <div class="record-controls">
      ${state.recording
        ? '<button class="record-button stop" onclick="stopRecording()">■ STOP</button>'
        : '<button class="record-button" onclick="startRecording()">● START STAGE</button>'}
    </div>
    <div style="font-size:9px;color:var(--muted);text-align:center;max-width:450px;line-height:1.6">
      Las sesiones solo contienen datos reales cuando existe una fuente de adquisición conectada.
      Sin conexión OBD, no se generarán valores ficticios.
    </div>
  </div>`;
}
function renderAnalysis(el) {
  const rows=state.sessions.map((s,i)=>`<tr>
    <td>${i+1}</td><td>${escapeHTML(s.name)}</td>
    <td>${formatTime(s.duration)}</td><td>${s.samples.length}</td>
    <td><button class="btn blue" onclick="exportSession(${i})">CSV</button>
    <button class="btn" onclick="deleteSession(${i})">DEL</button></td>
  </tr>`).join('');
  el.innerHTML=`<div class="panel">
    <div class="panel-title">SESSION DATABASE</div>
    <div class="notice">Las grabaciones se almacenan localmente en este navegador. Las sesiones antiguas pueden perderse si se borran los datos del navegador.</div>
    <table class="data-table">
      <thead><tr><th>#</th><th>SESSION</th><th>DURATION</th><th>SAMPLES</th><th>ACTIONS</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5">NO SESSIONS RECORDED</td></tr>'}</tbody>
    </table>
    <div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn blue" onclick="exportAll()">EXPORT ALL CSV</button>
      <button class="btn" onclick="refreshSessions()">REFRESH</button>
    </div>
  </div>`;
}
function renderDiagnostics(el) {
  el.innerHTML=`<div class="two-col">
    <div class="panel">
      <div class="panel-title">ECU COMMUNICATION</div>
      <div class="big-number" style="color:var(--yellow)">${state.connected?'ONLINE':'OFFLINE'}</div>
      <div class="statusline"><span>OBD ADAPTER</span><span>${state.connected?'CONNECTED':'NOT CONNECTED'}</span></div>
      <div class="statusline"><span>PROTOCOL</span><span>${state.connected?'DETECTED':'N/A'}</span></div>
      <div class="statusline"><span>ECU RESPONSE</span><span>${state.connected?'ACTIVE':'N/A'}</span></div>
      <div class="statusline"><span>DTC SCAN</span><span>N/A</span></div>
    </div>
    <div class="panel">
      <div class="panel-title">FAULT CODES</div>
      <div class="big-number" style="font-size:32px">N/A</div>
      <p style="font-size:10px;color:var(--muted);line-height:1.6">No ECU scan has been performed. Fault codes will be displayed here when the adapter and diagnostic functions are integrated.</p>
      <button class="btn" disabled>SCAN ECU · NOT AVAILABLE</button>
    </div>
  </div>`;
}
function renderGPS(el) {
  const p=state.gps;
  el.innerHTML=`<div class="two-col">
    <div class="panel">
      <div class="panel-title">GPS POSITION</div>
      <div class="big-number">${p?p.speed:'N/A'}<span style="font-size:15px"> KM/H</span></div>
      <div class="statusline"><span>LATITUDE</span><span>${p?p.lat:'N/A'}</span></div>
      <div class="statusline"><span>LONGITUDE</span><span>${p?p.lon:'N/A'}</span></div>
      <div class="statusline"><span>ACCURACY</span><span>${p?p.accuracy+' M':'N/A'}</span></div>
      <button class="btn blue" onclick="startGPS()">ENABLE GPS</button>
    </div>
    <div class="panel">
      <div class="panel-title">ROUTE DATA</div>
      <div class="big-number">${p?p.distance:'N/A'}<span style="font-size:15px"> KM</span></div>
      <p style="font-size:10px;color:var(--muted)">GPS access requires browser permission. Route recording will be synchronized with the session recorder.</p>
    </div>
  </div>`;
}
function renderSettings(el) {
  el.innerHTML=`<div class="panel">
    <div class="panel-title">SYSTEM CONFIGURATION</div>
    <div class="setting"><span>OBD ADAPTER</span><span>OBDLINK CX · PLANNED</span></div>
    <div class="setting"><span>CONNECTION</span><span>${state.connected?'CONNECTED':'WAITING FOR BRIDGE'}</span></div>
    <div class="setting"><span>DATA SOURCE</span><span>${state.connected?'LIVE':'NOT CONNECTED'}</span></div>
    <div class="setting"><span>UNITS</span><select id="units"><option>METRIC</option><option>IMPERIAL</option></select></div>
    <div class="setting"><span>SESSION STORAGE</span><span>LOCAL BROWSER</span></div>
    <div class="setting"><span>GPS PERMISSION</span><span>${navigator.geolocation?'AVAILABLE':'UNAVAILABLE'}</span></div>
    <div class="setting"><span>DEMO MODE</span><span>DISABLED</span></div>
    <div class="notice" style="margin-top:14px">La conexión real requiere la futura aplicación puente de iOS. Esta interfaz todavía no establece comunicación Bluetooth con el adaptador.</div>
    <button class="btn blue" onclick="refreshSessions()">CHECK LOCAL DATA</button>
  </div>`;
}
function formatTime(ms) {
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+
    String(Math.floor(s%3600/60)).padStart(2,'0')+':'+
    String(s%60).padStart(2,'0');
}
function startRecording() {
  if(state.recording)return;
  state.recording=true;state.startedAt=Date.now();state.elapsed=0;
  state.sessionSamples=[];
  state.timer=setInterval(()=>{
    state.elapsed=Date.now()-state.startedAt;
    if(state.currentModule==='record') {
      const c=$('recordClock');if(c)c.textContent=formatTime(state.elapsed);
    }
  },250);
  renderModule('record');
}
function stopRecording() {
  if(!state.recording)return;
  state.recording=false;clearInterval(state.timer);
  const session={
    name:'R7_'+new Date().toISOString().replace(/[:.]/g,'-'),
    date:new Date().toISOString(),
    duration:state.elapsed,
    samples:state.sessionSamples
  };
  state.sessions.unshift(session);
  saveSessions();
  state.elapsed=0;
  renderModule(state.currentModule);
}
function receiveData(data) {
  // Punto de entrada reservado para el futuro puente nativo.
  // Solo se aceptan campos presentes y valores numéricos válidos.
  if(!data || typeof data!=='object')return;
  const allowed=['speed','rpm','gear','throttle','load','voltage',
    'coolant','oilTemp','intake','oilPressure','map','boost','fuelPressure'];
  allowed.forEach(k=>{
    if(data[k]!==undefined && (typeof data[k]==='number' || data[k]===null))
      state.liveData[k]=data[k];
  });
  if(data.gforce && typeof data.gforce==='object') {
    state.liveData.gforce={...data.gforce};
  }
  state.connected=true;
  $('connection').innerHTML='<i class="dot" style="background:var(--green)"></i>OBD CONNECTED';
  $('footerState').textContent='LIVE DATA RECEIVED';
  if(state.recording) {
    state.sessionSamples.push({
      timestamp:Date.now(),
      ...state.liveData
    });
  }
  if(state.currentModule)renderModule(state.currentModule);
}
function startGPS() {
  if(!navigator.geolocation)return alert('GPS unavailable');
  navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    state.gps={
      lat:c.latitude.toFixed(6),lon:c.longitude.toFixed(6),
      speed:c.speed===null?'N/A':(c.speed*3.6).toFixed(1),
      accuracy:c.accuracy.toFixed(0),distance:'N/A'
    };
    if(state.recording)state.sessionSamples.push({
      timestamp:Date.now(),gps:state.gps
    });
    if(state.currentModule==='gps')renderModule('gps');
  },err=>alert('GPS error: '+err.message),{
    enableHighAccuracy:true,maximumAge:500,minDistance:1
  });
}
function saveSessions() {
  try {localStorage.setItem('r7_sessions',JSON.stringify(state.sessions));}
  catch(e){alert('Storage limit reached. Export your sessions.');}
}
function loadSessions() {
  try {state.sessions=JSON.parse(localStorage.getItem('r7_sessions')||'[]');}
  catch(e){state.sessions=[];}
}
function refreshSessions() {
  loadSessions();
  if(state.currentModule==='analysis')renderModule('analysis');
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadCSV(filename,rows) {
  const csv=rows.map(row=>row.map(v=>{
    const s=String(v??'');
    return '"'+s.replace(/"/g,'""')+'"';
  }).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
function exportSession(i) {
  const s=state.sessions[i];if(!s)return;
  const keys=[...new Set(s.samples.flatMap(x=>Object.keys(x)))];
  downloadCSV(s.name+'.csv',[
    ['timestamp',...keys],
    ...s.samples.map(x=>[x.timestamp,...keys.map(k=>
      typeof x[k]==='object'?JSON.stringify(x[k]):x[k]??'')])
  ]);
}
function exportAll() {
  const rows=[['session','timestamp','data']];
  state.sessions.forEach(s=>s.samples.forEach(x=>
    rows.push([s.name,x.timestamp,JSON.stringify(x)])));
  downloadCSV('R7_ALL_SESSIONS.csv',rows);
}
function deleteSession(i) {
  if(!confirm('Delete this session?'))return;
  state.sessions.splice(i,1);saveSessions();renderModule('analysis');
}
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('es-ES'),1000);
loadSessions();

// API pública para conectar la futura capa nativa.
// Ejemplo futuro: window.R7.ingest({rpm:3000,speed:80})
window.R7={
  ingest:receiveData,
  getStatus:()=>({connected:state.connected,recording:state.recording}),
  getSessions:()=>state.sessions
};
</script>
