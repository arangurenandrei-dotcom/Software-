<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clio V Rally 7 - Telemetría Total</title>
<style>
:root {
  --bg-dark: #030406;
  --panel-case: #0b0d10;
  --c-red: #ff2238;
  --c-green: #00ff66;
  --c-yellow: #ffb700;
  --c-blue: #00f0ff;
  --c-white: #ffffff;
  --c-muted: #627282;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
  background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center; align-items: center;
}

#app {
  width: 100vw; height: 100vh; height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  position: relative;
}

/* ALERTA ROJA GLOBAL DE TRAMO */
#global-alarm {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255, 34, 56, 0.95); z-index: 100;
  display: none; flex-direction: column; justify-content: center; align-items: center;
  color: #fff; text-align: center; padding: 20px;
  animation: flashAlarm 0.25s infinite alternate;
}
@keyframes flashAlarm { from { opacity: 0.7; } to { opacity: 1; } }
#global-alarm h1 { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
#global-alarm p { font-size: 15px; font-weight: 800; letter-spacing: 1px; }

/* LA BOTONERA 208 RALLY */
.rally-plate {
  width: 92%; max-width: 600px; height: 88%; max-height: 350px;
  background: var(--panel-case); border: 4px solid #1a1e26; border-radius: 18px;
  padding: 12px 16px; display: grid; grid-template-columns: 42px 1fr 42px; gap: 14px;
  box-shadow: inset 0 0 35px rgba(0,0,0,0.95), 0 10px 30px rgba(0,0,0,0.8);
  align-items: center; position: relative;
}

/* BOTONES LATERALES DE ESTADO GENERAL */
.status-side { display: flex; flex-direction: column; height: 100%; justify-content: center; }
.status-pad {
  height: 100%; background: #111419; border: 2.5px solid var(--c-green); border-radius: 10px; color: var(--c-green);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 10px 0; font-weight: 900; font-size: 9px; cursor: pointer; text-align: center;
  box-shadow: 0 0 10px rgba(0,255,102,0.2);
}
.status-pad.danger { border-color: var(--c-red); color: var(--c-red); box-shadow: 0 0 15px rgba(255,34,56,0.4); background: rgba(255,34,56,0.1); }
.status-icon { font-size: 14px; }

.keypad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 100%; }

.btn-cell { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s, filter 0.05s; }
.btn-cell:active { transform: scale(0.96); filter: brightness(1.3); }
.btn-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.btn-shape { fill: #0c0e12; stroke: var(--c-muted); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.led-diode { position: absolute; top: 7px; right: 14px; width: 6px; height: 6px; border-radius: 50%; background: #181818; z-index: 3; }
.btn-cell.active .led-diode { background: var(--c-red); box-shadow: 0 0 8px var(--c-red); }

.btn-cell.red .btn-shape { stroke: var(--c-red); }
.btn-cell.green .btn-shape { stroke: var(--c-green); }
.btn-cell.yellow .btn-shape { stroke: var(--c-yellow); }
.btn-cell.blue .btn-shape { stroke: var(--c-blue); }

.btn-cell.red .btn-content { color: var(--c-red); }
.btn-cell.green .btn-content { color: var(--c-green); }
.btn-cell.yellow .btn-content { color: var(--c-yellow); }
.btn-cell.blue .btn-content { color: var(--c-blue); }

.btn-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; pointer-events: none; }
.btn-title { font-size: 8px; font-weight: 900; letter-spacing: 0.5px; line-height: 1.1; }
.btn-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; }

/* PANTALLAS DE INFORMACIÓN PROFESIONALES */
.telemetry-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 10, 0.99);
  border-radius: 14px; padding: 12px; display: none; flex-direction: column; justify-content: space-between; z-index: 50; border: 2.5px solid #283345;
}
.telemetry-overlay.active { display: flex; }

.overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e2633; padding-bottom: 6px; }
.overlay-title { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--c-blue); }
.close-btn { background: #ff2238; border: none; color: #fff; padding: 5px 12px; border-radius: 4px; font-weight: 900; font-size: 10px; cursor: pointer; letter-spacing: 1px; }

.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; margin-top: 8px; }
.data-card { background: #0c1017; border: 2px solid #1c2533; border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.data-card label { font-size: 8px; font-weight: 900; color: var(--c-muted); letter-spacing: 1.5px; }
.data-card .value { font-size: 30px; font-weight: 900; font-family: monospace; color: #fff; line-height: 1; }
.data-card .unit { font-size: 10px; font-weight: 800; color: var(--c-muted); text-align: right; }
.status-tag { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 3px; display: inline-block; width: fit-content; margin-top: 4px; }
.status-tag.ok { background: rgba(0,255,102,0.15); color: var(--c-green); border: 1px solid var(--c-green); }
.status-tag.warn { background: rgba(255,183,0,0.15); color: var(--c-yellow); border: 1px solid var(--c-yellow); }
.status-tag.danger { background: rgba(255,34,56,0.2); color: var(--c-red); border: 1px solid var(--c-red); }
</style>
</head>
<body>

<div id="app">
  <!-- ALERTA ROJA GLOBAL -->
  <div id="global-alarm">
    <h1 id="alarm-title">⚠️ ¡ALERTA CRÍTICA DE TRAMO!</h1>
    <p id="alarm-desc">PARÁMETRO FUERA DE RANGO SEGURO. ¡BAJA EL RITMO INMEDIATAMENTE!</p>
    <button onclick="dismissAlarm()" style="margin-top:15px; padding:8px 20px; background:#fff; color:#000; border:none; font-weight:900; border-radius:4px; cursor:pointer; font-size:12px;">SILENCIAR</button>
  </div>

  <div class="rally-plate">
    
    <!-- LATERAL IZQUIERDO: ESTADO GENERAL -->
    <div class="status-side">
      <div class="status-pad" id="side-status-left" onclick="openDisplay('temps')">
        <span class="status-icon">🌡️</span>
        <span>SYS<br>CHECK</span>
        <span id="side-left-txt" style="font-size:7px;">OK</span>
      </div>
    </div>

    <!-- MATRIZ CENTRAL 100% MONITORIZACIÓN -->
    <div class="keypad-grid">

      <!-- 1. MOTOR & TEMPS -->
      <div class="btn-cell red active" onclick="openDisplay('temps')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2v10M8 12h8"/></svg>
          <span class="btn-title">MOTOR<br>TEMPS</span>
        </div>
      </div>

      <!-- 2. TURBO BOOST -->
      <div class="btn-cell yellow" onclick="openDisplay('pressures')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span class="btn-title">TURBO<br>PRESS</span>
        </div>
      </div>

      <!-- 3. FUERZAS G -->
      <div class="btn-cell blue" onclick="openDisplay('gforces')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 10.5V7a2 2 0 0 0-2-2h-3.5M5 13.5V17a2 2 0 0 0 2 2h3.5"/></svg>
          <span class="btn-title">FUERZAS G<br>CHASIS</span>
        </div>
      </div>

      <!-- 4. DIAGNÓSTICO ECU -->
      <div class="btn-cell yellow" onclick="openDisplay('faults')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/></svg>
          <span class="btn-title">ECU / DTC<br>FALLOS</span>
        </div>
      </div>

      <!-- 5. GRABACIÓN TRAMO (CSV) -->
      <div class="btn-cell red" id="rec-btn" onclick="toggleRecording()">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          <span class="btn-title" id="rec-lbl">REC<br>TRAMO</span>
        </div>
      </div>

      <!-- 6. ESTADÍSTICAS -->
      <div class="btn-cell blue" onclick="openDisplay('stats')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          <span class="btn-title">ESTATS<br>TRAMO</span>
        </div>
      </div>

      <!-- 7. BATERÍA / VOLTAJE -->
      <div class="btn-cell green" onclick="openDisplay('faults')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="12" rx="2"/><path d="M22 11v4"/></svg>
          <span class="btn-title">VOLTAJE<br>BATERÍA</span>
        </div>
      </div>

      <!-- 8. CLIMA / AMBIENTE -->
      <div class="btn-cell yellow" onclick="openDisplay('temps')">
        <div class="led-diode"></div>
        <svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none">
          <path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/>
        </svg>
        <div class="btn-content">
          <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
          <span class="btn-title">AMBIENTE<br>Y ADM.</span>
        </div>
      </div>

    </div>

    <!-- LATERAL DERECHO: ESTADO GENERAL -->
    <div class="status-side">
      <div class="status-pad" id="side-status-right" onclick="openDisplay('pressures')">
        <span class="status-icon">⚙️</span>
        <span>BOOST<br>CHECK</span>
        <span id="side-right-txt" style="font-size:7px;">OK</span>
      </div>
    </div>

    <!-- PANTALLAS DE INFORMACIÓN CLARA -->
    <div class="telemetry-overlay" id="overlay">
      <div class="overlay-header">
        <span class="overlay-title" id="ov-title">MONITOR</span>
        <button class="close-btn" onclick="closeDisplay()">CERRAR ✖</button>
      </div>
      <div class="data-grid" id="ov-content"></div>
    </div>

  </div>
</div>

<script>
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeep(freq = 600, duration = 0.04) {
  try {
    initAudio();
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function actionFeedback(freq = 650) {
  if (navigator.vibrate) navigator.vibrate(45);
  playBeep(freq, 0.05);
}

let isRec = false, logData = [], maxSpd = 0;

function toggleRecording() {
  actionFeedback(isRec ? 400 : 900);
  isRec = !isRec;
  const btn = document.getElementById('rec-btn');
  const lbl = document.getElementById('rec-lbl');
  if (isRec) {
    logData = [['Timestamp', 'Speed_kmh', 'Boost_bar', 'IAT_C', 'ECT_C', 'Oil_C']];
    maxSpd = 0;
    btn.classList.add('active');
    lbl.innerHTML = 'GRABANDO...';
  } else {
    btn.classList.remove('active');
    lbl.innerHTML = 'REC<br>TRAMO';
    downloadCSV();
  }
}

function downloadCSV() {
  if (logData.length <= 1) return;
  let csv = "data:text/csv;charset=utf-8," + logData.map(e => e.join(",")).join("\n");
  let uri = encodeURI(csv);
  let link = document.createElement("a");
  link.setAttribute("href", uri);
  link.setAttribute("download", "clio_v_telemetria.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function openDisplay(type) {
  actionFeedback(600);
  const ov = document.getElementById('overlay');
  const title = document.getElementById('ov-title');
  const content = document.getElementById('ov-content');
  ov.classList.add('active');

  if (type === 'temps') {
    title.innerText = "ESTADO TÉRMICO DE MOTOR";
    content.innerHTML = `
      <div class="data-card"><label>REFRIGERANTE (ECT)</label><div class="value" id="ect-v">--</div><div class="unit">°C</div><div class="status-tag" id="ect-tag">COMPROBANDO</div></div>
      <div class="data-card"><label>ADMISIÓN (IAT)</label><div class="value" id="iat-v">--</div><div class="unit">°C</div><div class="status-tag" id="iat-tag">COMPROBANDO</div></div>
      <div class="data-card"><label>ACEITE MOTOR</label><div class="value" id="oil-t-v">--</div><div class="unit">°C</div><div class="status-tag" id="oil-t-tag">COMPROBANDO</div></div>
      <div class="data-card"><label>ESTADO GENERAL</label><div class="value" style="font-size:20px; color:var(--c-green)">ÓPTIMO</div><div class="unit">SAFETY</div><div class="status-tag ok">SIN RIESGO</div></div>
    `;
  } else if (type === 'pressures') {
    title.innerText = "MONITOR DE PRESIONES DE TRAMO";
    content.innerHTML = `
      <div class="data-card"><label>TURBO BOOST REL.</label><div class="value" id="boost-v">--</div><div class="unit">BAR</div><div class="status-tag ok">PRESIÓN ESTABLE</div></div>
      <div class="data-card"><label>PRESIÓN ACEITE</label><div class="value" id="oil-p-v">--</div><div class="unit">BAR</div><div class="status-tag" id="oil-p-tag">COMPROBANDO</div></div>
      <div class="data-card"><label>PRESIÓN COMBUSTIBLE</label><div class="value">3.8</div><div class="unit">BAR</div><div class="status-tag ok">INYECCIÓN OK</div></div>
      <div class="data-card"><label>PRESIÓN MAP ABS.</label><div class="value" id="map-v">--</div><div class="unit">kPa</div><div class="status-tag ok">SENSOR OK</div></div>
    `;
  } else if (type === 'gforces') {
    title.innerText = "DINÁMICA Y FUERZAS G (CHASIS)";
    content.innerHTML = `
      <div class="data-card"><label>ACELERACIÓN LATERAL</label><div class="value" id="g-lat">0.00</div><div class="unit">G</div><div class="status-tag ok">GRIP NORMAL</div></div>
      <div class="data-card"><label>ACELERACIÓN LONGITUDINAL</label><div class="value" id="g-long">0.00</div><div class="unit">G</div><div class="status-tag ok">FRENADA / ACEL</div></div>
      <div class="data-card"><label>PICO MÁXIMO G</label><div class="value" id="g-max">0.00</div><div class="unit">G</div><div class="status-tag ok">REGISTRADO</div></div>
      <div class="data-card"><label>ESTABILIDAD</label><div class="value" style="font-size:20px; color:var(--c-blue)">ACTIVA</div><div class="unit">SENSOR</div><div class="status-tag ok">EN LÍNEA</div></div>
    `;
  } else if (type === 'faults') {
    title.innerText = "DIAGNÓSTICO Y CÓDIGOS DE ERROR ECU";
    content.innerHTML = `
      <div class="data-card" style="grid-column:span 2"><label>ESTADO GENERAL CAN-BUS / ECU</label><div class="value" style="font-size:22px; color:var(--c-green)">SISTEMA LIMPIO - SIN DTC</div><div class="unit">H5Ht ECU OK</div><div class="status-tag ok">CERO ERRORES</div></div>
      <div class="data-card"><label>TENSIÓN DE BATERÍA</label><div class="value" id="volt-v">14.2</div><div class="unit">V</div><div class="status-tag ok">ALTERNADOR OK</div></div>
      <div class="data-card"><label>ENLACE BLUETOOTH OBD</label><div class="value" style="font-size:20px; color:var(--c-green)">ONLINE</div><div class="unit">LATENCIA < 20ms</div><div class="status-tag ok">CONECTADO</div></div>
    `;
  } else if (type === 'stats') {
    title.innerText = "RESUMEN DE RENDIMIENTO DE TRAMO";
    content.innerHTML = `
      <div class="data-card"><label>VELOCIDAD MÁXIMA</label><div class="value">${maxSpd}</div><div class="unit">KM/H</div><div class="status-tag ok">TOP SPEED</div></div>
      <div class="data-card"><label>PUNTOS DE TELEMETRÍA</label><div class="value">${Math.max(0, logData.length - 1)}</div><div class="unit">MUESTRAS CSV</div></div>
      <div class="data-card" style="grid-column:span 2"><label>ESTADO DE GRABACIÓN</label><div class="value" style="font-size:22px;">${isRec ? '🔴 GRABANDO EN DIRECTO' : '🟢 EN ESPERA'}</div><div class="unit">BUFFER CSV</div><div class="status-tag ${isRec ? 'danger' : 'ok'}">${isRec ? 'ACTIVO' : 'LISTO'}</div></div>
    `;
  }
}

function closeDisplay() {
  actionFeedback(400);
  document.getElementById('overlay').classList.remove('active');
}

function dismissAlarm() {
  actionFeedback(500);
  document.getElementById('global-alarm').style.display = 'none';
}

/* ACELERÓMETRO Y DATOS */
let currentGLat = 0, currentGLong = 0, maxG = 0;
if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', (e) => {
    if (e.accelerationIncludingGravity) {
      let ax = e.accelerationIncludingGravity.x || 0;
      let ay = e.accelerationIncludingGravity.y || 0;
      currentGLat = (ax / 9.81).toFixed(2);
      currentGLong = (ay / 9.81).toFixed(2);
      let totalG = Math.sqrt(currentGLat*currentGLat + currentGLong*currentGLong).toFixed(2);
      if (totalG > maxG) maxG = totalG;
    }
  });
}

setInterval(() => {
  let t = Date.now() / 1000;
  let spd = Math.round(55 + 85 * Math.abs(Math.sin(t / 1.2)));
  let boost = Math.max(0.0, 0.4 + 1.2 * Math.sin(t));
  let iat = Math.round(42 + 15 * Math.abs(Math.sin(t / 5)));
  let ect = Math.round(91 + 12 * Math.sin(t / 7));
  let oilT = Math.round(104 + 8 * Math.sin(t / 9));
  let oilP = (4.1 - 0.4 * Math.sin(t)).toFixed(1);

  if (spd > maxSpd) maxSpd = spd;

  const elIat = document.getElementById('iat-v'); 
  if (elIat) {
    elIat.innerText = iat;
    let tg = document.getElementById('iat-tag');
    tg.className = 'status-tag ' + (iat > 55 ? 'danger' : (iat > 48 ? 'warn' : 'ok'));
    tg.innerText = iat > 55 ? 'ALERTA ADMISIÓN' : (iat > 48 ? 'ELEVADO' : 'ÓPTIMO');
  }

  const elEct = document.getElementById('ect-v'); 
  if (elEct) {
    elEct.innerText = ect;
    let tg = document.getElementById('ect-tag');
    tg.className = 'status-tag ' + (ect > 102 ? 'danger' : (ect > 98 ? 'warn' : 'ok'));
    tg.innerText = ect > 102 ? '¡PELIGRO CALOR!' : (ect > 98 ? 'VIGILAR' : 'ESTABLE');
  }

  const elOilT = document.getElementById('oil-t-v'); 
  if (elOilT) {
    elOilT.innerText = oilT;
    let tg = document.getElementById('oil-t-tag');
    tg.className = 'status-tag ' + (oilT > 115 ? 'danger' : (oilT > 108 ? 'warn' : 'ok'));
    tg.innerText = oilT > 115 ? 'ACEITE CALIENTE' : 'CORRECTO';
  }

  const elBst = document.getElementById('boost-v'); if (elBst) elBst.innerText = boost.toFixed(2);
  const elMap = document.getElementById('map-v'); if (elMap) elMap.innerText = Math.round((boost * 100) + 101);
  const elOilP = document.getElementById('oil-p-v'); 
  if (elOilP) {
    elOilP.innerText = oilP;
    let tg = document.getElementById('oil-p-tag');
    tg.className = 'status-tag ' + (oilP < 2.0 ? 'danger' : 'ok');
    tg.innerText = oilP < 2.0 ? '¡PRESIÓN BAJA!' : 'PRESIÓN OK';
  }

  const elGLat = document.getElementById('g-lat'); if (elGLat) elGLat.innerText = currentGLat;
  const elGLong = document.getElementById('g-long'); if (elGLong) elGLong.innerText = currentGLong;
  const elGMax = document.getElementById('g-max'); if (elGMax) elGMax.innerText = maxG;

  /* Actualizar paneles laterales de estado general */
  const sideLeft = document.getElementById('side-status-left');
  const sideLeftTxt = document.getElementById('side-left-txt');
  const sideRight = document.getElementById('side-status-right');
  const sideRightTxt = document.getElementById('side-right-txt');

  if (ect > 102 || oilP < 2.0) {
    sideLeft.className = 'status-pad danger';
    sideLeftTxt.innerText = '¡ALERTA!';
  } else {
    sideLeft.className = 'status-pad';
    sideLeftTxt.innerText = 'OK';
  }

  // Alarma global si algo pasa de los límites seguros de tramo
  let alarmActive = false;
  let reason = "";
  if (ect > 102) { alarmActive = true; reason = `¡REFRIGERANTE CRÍTICO (${ect}°C)! REDUCE RITMO.`; }
  else if (oilP < 1.8) { alarmActive = true; reason = `¡PRESIÓN DE ACEITE BAJA (${oilP} BAR)! PARA YA.`; }
  else if (oilT > 118) { alarmActive = true; reason = `¡TEMPERATURA DE ACEITE AL LÍMITE (${oilT}°C)!`; }

  const glob = document.getElementById('global-alarm');
  if (alarmActive) {
    document.getElementById('alarm-desc').innerText = reason;
    glob.style.display = 'flex';
  }

  if (isRec) {
    logData.push([new Date().toISOString(), spd, boost.toFixed(2), iat, ect, oilT]);
  }
}, 100);
</script>
</body>
