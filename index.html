<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Clio V Rally4 Keypad & Dash</title>
    <style>
        :root {
            --bg-color: #050608;
            --box-bg: #0d1117;
            --box-border: #161b22;
            --accent-green: #00ff66;
            --accent-yellow: #ffb700;
            --accent-red: #ff1e38;
            --accent-cyan: #00f0ff;
            --accent-blue: #0088ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        
        header {
            background: #090c10; border-bottom: 2px solid var(--box-border);
            padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand-tag { font-size: 11px; font-weight: 900; letter-spacing: 2px; color: var(--text-muted); }
        .brand-tag span { color: var(--accent-red); }
        .status-pill {
            display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 800;
            background: #040608; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--box-border);
        }
        .led-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        nav { display: flex; background: #020305; border-bottom: 1px solid var(--box-border); }
        .nav-btn {
            flex: 1; padding: 10px 0; text-align: center; font-size: 9px; font-weight: 900;
            color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.04); }

        main { flex: 1; padding: 8px; overflow-y: auto; }
        .tab-content { display: none; height: 100%; flex-direction: column; gap: 8px; }
        .tab-content.active { display: flex; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }

        .card {
            background: var(--box-bg); border: 1px solid var(--box-border);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-full { grid-column: span 2; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .card-body { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 2px 0; }
        .value { font-size: 38px; font-weight: 900; font-family: monospace; color: #ffffff; letter-spacing: -1px; }
        .unit { font-size: 10px; font-weight: 800; color: var(--text-muted); }

        /* Shift Lights */
        .shift-lights { display: flex; gap: 3px; margin-top: 4px; width: 100%; }
        .shift-led { flex: 1; height: 8px; background: #131722; border-radius: 2px; }
        .shift-led.green.on { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .shift-led.yellow.on { background: var(--accent-yellow); box-shadow: 0 0 8px var(--accent-yellow); }
        .shift-led.red.on { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
        .shift-led.blink { background: #fff !important; box-shadow: 0 0 14px #fff !important; }

        /* PANEL KEYPAD TIPO PEUGEOT RALLY4 */
        .keypad-panel {
            background: #11141a; border: 3px solid #222834; border-radius: 12px;
            padding: 12px; display: grid; grid-template-columns: 50px 1fr 1fr 50px; gap: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.6);
            align-items: center;
        }
        .keypad-side { display: flex; flex-direction: column; gap: 8px; }
        .keypad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .r-btn {
            background: #181d28; border: 2px solid #2d3546; border-radius: 8px;
            height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; cursor: pointer; transition: all 0.1s; position: relative;
        }
        .r-btn:active, .r-btn.active {
            transform: scale(0.96); filter: brightness(1.3);
        }
        .r-btn-icon { width: 18px; height: 18px; fill: currentColor; }
        .r-btn-label { font-size: 7px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Colores de los marcos retroiluminados como en el coche de carreras */
        .r-btn.red { border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 8px rgba(255,30,56,0.2); }
        .r-btn.red.active { background: rgba(255,30,56,0.2); box-shadow: 0 0 15px var(--accent-red); }

        .r-btn.green { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 8px rgba(0,255,102,0.2); }
        .r-btn.green.active { background: rgba(0,255,102,0.2); box-shadow: 0 0 15px var(--accent-green); }

        .r-btn.yellow { border-color: var(--accent-yellow); color: var(--accent-yellow); box-shadow: 0 0 8px rgba(255,183,0,0.2); }
        .r-btn.yellow.active { background: rgba(255,183,0,0.2); box-shadow: 0 0 15px var(--accent-yellow); }

        .r-btn.cyan { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0,240,255,0.2); }
        .r-btn.cyan.active { background: rgba(0,240,255,0.2); box-shadow: 0 0 15px var(--accent-cyan); }
