    <style>
        :root {
            --bg-color: #030406;
            --panel-bg: #090c10;
            --panel-border: #1f2633;
            --accent-green: #00ff66;
            --accent-yellow: #ffb700;
            --accent-red: #ff1e38;
            --accent-cyan: #00f0ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --carbon-pattern: repeating-linear-gradient(45deg, #090c10, #090c10 10px, #06080c 10px, #06080c 20px);
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        /* Splash Screen Profesional con Nuevo Rombo Renault */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
            opacity: 1; transition: opacity 0.7s ease, transform 0.7s ease;
        }
        #splash-screen.fade-out { opacity: 0; transform: scale(1.03); pointer-events: none; }
        .renault-diamond-container {
            width: 80px; height: 80px; position: relative; margin-bottom: 25px;
            animation: pulseDiamond 2s infinite alternate ease-in-out;
        }
        /* Nuevo Rombo Plano de Lineas Minimalistas */
        .diamond-part {
            position: absolute; width: 45px; height: 45px; border: 3px solid var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }
        .diamond-1 { top: 0; left: 17px; transform: rotate(45deg); border-right: none; border-bottom: none; }
        .diamond-2 { bottom: 0; left: 17px; transform: rotate(45deg); border-left: none; border-top: none; }
        @keyframes pulseDiamond {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 8px rgba(0,240,255,0.3)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(0,240,255,0.8)); }
        }
        .splash-title { font-size: 22px; font-weight: 900; letter-spacing: 5px; color: #fff; margin-bottom: 2px; }
        .splash-sub { font-size: 11px; font-weight: 700; color: var(--accent-cyan); letter-spacing: 4px; margin-bottom: 15px; }
        .splash-badge {
            background: rgba(255, 30, 56, 0.12); border: 1px solid var(--accent-red);
            color: var(--accent-red); padding: 5px 14px; font-size: 9px; font-weight: 800; border-radius: 3px; letter-spacing: 3px;
        }
        header {
            background: var(--panel-bg); border-bottom: 2px solid var(--panel-border);
            padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand-tag { font-size: 11px; font-weight: 900; color: var(--text-muted); letter-spacing: 2px; }
        .brand-tag span { color: var(--accent-red); }
        .status-pill {
            display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 800;
            background: #040608; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--panel-border);
        }
        .led-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-red); }
        .led-dot.active { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        nav { display: flex; background: #020305; border-bottom: 1px solid var(--panel-border); }
        .nav-btn {
            flex: 1; padding: 11px 0; text-align: center; font-size: 9px; font-weight: 900;
            color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.03); }
        main { flex: 1; padding: 10px; overflow-y: auto; background-image: var(--carbon-pattern); }
        .tab-content { display: none; height: 100%; flex-direction: column; gap: 8px; }
        .tab-content.active { display: flex; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }

            border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; overflow: hidden;
        }
