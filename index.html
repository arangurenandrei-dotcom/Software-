<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clio V Rally 7 - Telemetría Real</title>
<style>
:root { --bg-dark: #030406; --panel-case: #0b0d10; --c-red: #ff2238; --c-green: #00ff66; --c-yellow: #ffb700; --c-blue: #00f0ff; --c-white: #ffffff; --c-muted: #627282; }
body.light-theme { --bg-dark: #e0e4eb; --panel-case: #cbd2df; --c-white: #111419; --c-muted: #4a5568; }
body.light-theme .rally-plate { background: #cbd2df; border-color: #94a3b8; }
body.light-theme .btn-shape { fill: #e2e8f0; }
body.light-theme .status-pad, body.light-theme .settings-pad { background: #d8edf8; color: #111; }
body.light-theme .telemetry-overlay { background: rgba(220, 226, 235, 0.98); border-color: #94a3b8; color: #111; }
body.light-theme .data-card { background: #cbd5e1; border-color: #94a3b8; color: #111; }
body.light-theme .data-card .value { color: #111; }
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; }
#app { width: 100vw; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); position: relative; }

#global-alarm { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 34, 56, 0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; padding: 20px; animation: flashAlarm 0.25s infinite alternate; }
@keyframes flashAlarm { from { opacity: 0.7; } to { opacity: 1; } }
#global-alarm h1 { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
#global-alarm p { font-size: 15px; font-weight: 800; letter-spacing: 1px; }

.rally-plate { width: 95%; max-width: 620px; height: 85%; max-height: 340px; background: var(--panel-case); border: 4px solid #1a1e26; border-radius: 18px; padding: 10px 14px; display: grid; grid-template-columns: 46px 1fr 46px; gap: 12px; box-shadow: inset 0 0 35px rgba(0,0,0,0.95), 0 10px 30px rgba(0,0,0,0.8); align-items: center; position: relative; }
.status-side { display: flex; flex-direction: column; height: 100%; justify-content: center; }
.status-pad { height: 100%; background: #111419; border: 2.5px solid var(--c-muted); border-radius: 10px; color: var(--c-muted); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 0; font-weight: 900; font-size: 8px; cursor: pointer; text-align: center; }
.status-pad.connected { border-color: var(--c-green); color: var(--c-green); box-shadow: 0 0 12px rgba(0,255,102,0.3); }
.settings-side { display: flex; flex-direction: column; height: 100%; justify-content: center; }
.settings-pad { height: 100%; background: #111419; border: 2.5px solid var(--c-blue); border-radius: 10px; color: var(--c-blue); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 0; font-weight: 900; font-size: 8px; cursor: pointer; text-align: center; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.keypad-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 6px; height: 100%; }
.btn-cell { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.btn-cell:active { transform: scale(0.96); filter: brightness(1.3); }
.btn-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.btn-shape { fill: #0c0e12; stroke: var(--c-muted); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.led-diode { position: absolute; top: 5px; right: 10px; width: 5px; height: 5px; border-radius: 50%; background: #181818; z-index: 3; }
.btn-cell.active .led-diode { background: var(--c-red); box-shadow: 0 0 6px var(--c-red); }
.btn-cell.red .btn-shape { stroke: var(--c-red); }
.btn-cell.green .btn-shape { stroke: var(--c-green); }
.btn-cell.yellow .btn-shape { stroke: var(--c-yellow); }
.btn-cell.blue .btn-shape { stroke: var(--c-blue); }
.btn-cell.red .btn-content { color: var(--c-red); }
.btn-cell.green .btn-content { color: var(--c-green); }
.btn-cell.yellow .btn-content { color: var(--c-yellow); }
.btn-cell.blue .btn-content { color: var(--c-blue); }
.btn-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1px; pointer-events: none; }
.btn-title { font-size: 7.5px; font-weight: 900; letter-spacing: 0.3px; line-height: 1.0; }
.btn-icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.telemetry-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 10, 0.99); border-radius: 14px; padding: 10px; display: none; flex-direction: column; justify-content: space-between; z-index: 50; border: 2.5px solid #283345; }
.telemetry-overlay.active { display: flex; }
.overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e2633; padding-bottom: 4px; }
.overlay-title { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: var(--c-blue); }
.close-btn { background: #ff2238; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: 900; font-size: 9px; cursor: pointer; }
.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; margin-top: 6px; overflow-y: auto; }
.data-card { background: #0c1017; border: 1.5px solid #1c2533; border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.data-card label { font-size: 7.5px; font-weight: 900; color: var(--c-muted); letter-spacing: 1px; }
.data-card .value { font-size: 24px; font-weight: 900; font-family: monospace; color: var(--c-white); line-height: 1; }
.data-card .unit { font-size: 9px; font-weight: 800; color: var(--c-muted); text-align: right; }
.status-tag { font-size: 7.5px; font-weight: 900; padding: 2px 4px; border-radius: 3px; display: inline-block; width: fit-content; margin-top: 2px; }
.status-tag.ok { background: rgba(0,255,102,0.15); color: var(--c-green); border: 1px solid var(--c-green); }
.status-tag.warn { background: rgba(255,183,0,0.15); color: var(--c-yellow); border: 1px solid var(--c-yellow); }
.status-tag.danger { background: rgba(255,34,56,0.2); color: var(--c-red); border: 1px solid var(--c-red); }
.setting-row { display: flex; justify-content: space-between; align-items: center; background: #0c1017; border: 1px solid #1c2533; padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; }
.setting-row span { font-size: 10px; font-weight: 800; color: #fff; }
.setting-btn { background: #1e2633; color: #fff; border: 1px solid #3b4657; padding: 5px 10px; border-radius: 4px; font-weight: 900; font-size: 9px; cursor: pointer; }
.setting-btn.active { background: var(--c-green); color: #000; border-color: var(--c-green); }
</style>
</head>
<body>

<div id="app">
  <div id="global-alarm">
    <h1 id="alarm-title">⚠️ ¡ALERTA CRÍTICA DE TRAMO!</h1>
    <p id="alarm-desc">PARÁMETRO FUERA DE RANGO SEGURO. ¡BAJA EL RITMO!</p>
    <button onclick="dismissAlarm()" style="margin-top:12px; padding:6px 16px; background:#fff; color:#000; border:none; font-weight:900; border-radius:4px; cursor:pointer; font-size:11px;">SILENCIAR</button>
  </div>

  <div class="rally-plate">
    <div class="status-side">
      <div class="status-pad" id="bt-pad" onclick="connectOBD2()">
        <span style="font-size:12px;">📶</span><span>OBD2<br>BLE</span><span id="bt-status-txt" style="font-size:6.5px;">CONECTAR</span>
      </div>
    </div>
    
    <div class="keypad-grid">
      <div class="btn-cell red active" onclick="openDisplay('temps')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2v10M8 12h8"/></svg><span class="btn-title">MOTOR<br>TEMPS</span></div></div>
      <div class="btn-cell yellow" onclick="openDisplay('pressures')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span class="btn-title">TURBO<br>PRESS</span></div></div>
      <div class="btn-cell blue" onclick="openDisplay('gforces')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 10.5V7a2 2 0 0 0-2-2h-3.5M5 13.5V17a2 2 0 0 0 2 2h3.5"/></svg><span class="btn-title">FUERZAS G<br>CHASIS</span></div></div>
      <div class="btn-cell yellow" onclick="openDisplay('faults')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/></svg><span class="btn-title">ECU / DTC<br>FALLOS</span></div></div>
      <div class="btn-cell red" id="rec-btn" onclick="toggleRecording()"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span class="btn-title" id="rec-lbl">REC<br>TRAMO</span></div></div>
      <div class="btn-cell blue" onclick="openDisplay('stats')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="btn-title">ESTATS<br>TRAMO</span></div></div>
      <div class="btn-cell green" onclick="openDisplay('faults')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="12" rx="2"/><path d="M22 11v4"/></svg><span class="btn-title">VOLTAJE<br>BATERÍA</span></div></div>
      <div class="btn-cell yellow" onclick="openDisplay('temps')"><div class="led-diode"></div><svg class="btn-svg" viewBox="0 0 100 80" preserveAspectRatio="none"><path class="btn-shape" d="M 6,14 L 62,14 C 64,14 66,12 66,9 L 66,5 C 66,2 68,0 72,0 L 90,0 C 94,0 96,2 96,5 L 96,16 C 96,18 98,20 100,22 L 100,74 C 100,78 96,80 90,80 L 10,80 C 4,80 0,76 0,70 L 0,20 C 0,16 3,14 6,14 Z"/></svg><div class="btn-content"><svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg><span class="btn-title">AMBIENTE<br>Y ADM.</span></div></div>
    </div>

    <div class="settings-side">
      <div class="settings-pad" onclick="openDisplay('settings')"><span style="font-size:14px;">⚙️</span><span>CONFIG<br>Y TEMA</span><span style="font-size:6.5px; color:var(--c-blue);">AJUSTES</span></div>
    </div>

    <div class="telemetry-overlay" id="overlay">
      <div class="overlay-header"><span class="overlay-title" id="ov-title">MONITOR</span><button class="close-btn" onclick="closeDisplay()">CERRAR ✖</button></div>
      <div class="data-grid" id="ov-content"></div>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
let settings = { sound: true, vibrate: true, theme: 'dark' };

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playBeep(freq = 600, duration = 0.04) {
  if (!settings.sound) return;
  try {
    initAudio();
    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function actionFeedback(freq = 650) { if (settings.vibrate && navigator.vibrate) navigator.vibrate(45); playBeep(freq, 0.05); }

// --- LÓGICA DE DATOS REALES (Sin simulaciones) ---
let obdData = {
  ect: "--", iat: "--", map: "--", boost: "--", speed: "--", volt: "--"
};

let btDevice, btServer, rxCharacteristic, txCharacteristic;
let isConnected = false;

async function connectOBD2() {
  actionFeedback(750);
  try {
    document.getElementById('bt-status-txt').innerText = "BUSCANDO...";
    
    btDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb']
    });

    btServer = await btDevice.gatt.connect();
    
    let service = await btServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb').catch(() => null);
    if(service) {
      rxCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
      txCharacteristic = rxCharacteristic;
      
      await rxCharacteristic.startNotifications();
      rxCharacteristic.addEventListener('characteristicvaluechanged', handleOBDResponse);
    }
    
    isConnected = true;
    document.getElementById('bt-pad').className = 'status-pad connected';
    document.getElementById('bt-status-txt').innerText = "CONECTADO";
    actionFeedback(900);
    
    startOBDPooling();
    
  } catch (error) {
    document.getElementById('bt-status-txt').innerText = "CONECTAR";
    if (error.name !== 'NotFoundError') alert("Fallo al conectar. Asegúrate de usar Bluefy y un adaptador BLE.");
  }
}

let rxBuffer = "";
function handleOBDResponse(event) {
  let value = new TextDecoder().decode(event.target.value);
  rxBuffer += value;
  
  if (rxBuffer.includes('>')) {
    let cleanHex = rxBuffer.replace(/[\r\n> ]/g, '');
    rxBuffer = "";
    
    if (cleanHex.startsWith("4105")) {
      obdData.ect = parseInt(cleanHex.substring(4, 6), 16) - 40;
    } else if (cleanHex.startsWith("410F")) {
      obdData.iat = parseInt(cleanHex.substring(4, 6), 16) - 40;
    } else if (cleanHex.startsWith("410B")) {
      obdData.map = parseInt(cleanHex.substring(4, 6), 16);
      obdData.boost = ((obdData.map - 100) / 100).toFixed(2);
    } else if (cleanHex.startsWith("410D")) {
      obdData.speed = parseInt(cleanHex.substring(4, 6), 16);
    }
    updateScreens();
  }
}

async function sendOBDCommand(cmd) {
  if (!txCharacteristic) return;
  let encoder = new TextEncoder();
  await txCharacteristic.writeValue(encoder.encode(cmd + "\r"));
}

async function startOBDPooling() {
  if (!isConnected) return;
  
  await sendOBDCommand("ATZ"); setTimeout(async () => {
    await sendOBDCommand("ATE0"); setTimeout(async () => {
      await sendOBDCommand("ATL0");
    }, 500);
  }, 500);

  setInterval(async () => {
    if(!isConnected) return;
    await sendOBDCommand("0105");
    setTimeout(async () => await sendOBDCommand("010F"), 150);
    setTimeout(async () => await sendOBDCommand("010B"), 300);
    setTimeout(async () => await sendOBDCommand("010D"), 450);
  }, 1000);
}

// INTERFAZ DE USUARIO CON SISTEMA DE ALARMAS DE TURBO Y TEMPERATURAS
function updateScreens() {
  const elEct = document.getElementById('ect-v'); if (elEct) elEct.innerText = obdData.ect;
  const elIat = document.getElementById('iat-v'); if (elIat) elIat.innerText = obdData.iat;
  const elBst = document.getElementById('boost-v'); if (elBst) elBst.innerText = obdData.boost > 0 ? obdData.boost : "0.00";
  const elMap = document.getElementById('map-v'); if (elMap) elMap.innerText = obdData.map;
  
  let alarmActive = false;
  let reason = "";

  // 1. ALERTA CRÍTICA DE TURBO (Overboost > 1.45 BAR)
  if (obdData.boost !== "--" && parseFloat(obdData.boost) > 1.45) {
    alarmActive = true;
    reason = `¡SOBREPRESIÓN DE TURBO CRÍTICA (${obdData.boost} BAR)! POSIBLE OVERBOOST.`;
  }
  // 2. ALERTA CRÍTICA DE REFRIGERANTE (ECT > 105 °C)
  else if (obdData.ect !== "--" && obdData.ect > 105) {
    alarmActive = true;
    reason = `¡REFRIGERANTE CRÍTICO (${obdData.ect}°C)! RIESGO DE SOBRECALENTAMIENTO.`;
  }
  // 3. ALERTA CRÍTICA DE ADMISIÓN / INTERCOOLER (IAT > 58 °C)
  else if (obdData.iat !== "--" && obdData.iat > 58) {
    alarmActive = true;
    reason = `¡INTERCOOLER SATURADO (${obdData.iat}°C IAT)! PÉRDIDA DE RENDIMIENTO.`;
  }

  const glob = document.getElementById('global-alarm');
  if (alarmActive) {
    document.getElementById('alarm-desc').innerText = reason;
    glob.style.display = 'flex';
    playBeep(900, 0.15);
  }
}

// FUERZAS G (SENSORES REALES DEL IPHONE)
let currentGLat = 0, currentGLong = 0, maxG = 0;
if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', (e) => {
    if (e.accelerationIncludingGravity) {
      let ax = e.accelerationIncludingGravity.x || 0;
      let ay = e.accelerationIncludingGravity.y || 0;
      currentGLat = (ax / 9.81).toFixed(2);
      currentGLong = (ay / 9.81).toFixed(2);
      let totalG = Math.sqrt(currentGLat*currentGLat + currentGLong*currentGLong).toFixed(2);
      if (totalG > maxG) maxG = totalG;
      
      const elGLat = document.getElementById('g-lat'); if (elGLat) elGLat.innerText = currentGLat;
      const elGLong = document.getElementById('g-long'); if (elGLong) elGLong.innerText = currentGLong;
      const elGMax = document.getElementById('g-max'); if (elGMax) elGMax.innerText = maxG;
    }
  });
}

// SISTEMA DE GRABACIÓN
let isRec = false, logData = [];
function toggleRecording() {
  actionFeedback(isRec ? 400 : 900);
  isRec = !isRec;
  const btn = document.getElementById('rec-btn'); const lbl = document.getElementById('rec-lbl');
  if (isRec) {
    logData = [['Timestamp', 'Speed_kmh', 'Boost_bar', 'IAT_C', 'ECT_C']];
    btn.classList.add('active'); lbl.innerHTML = 'GRABANDO...';
    
    window.recInterval = setInterval(() => {
      logData.push([new Date().toISOString(), obdData.speed, obdData.boost, obdData.iat, obdData.ect]);
    }, 1000);
  } else {
    btn.classList.remove('active'); lbl.innerHTML = 'REC<br>TRAMO';
    clearInterval(window.recInterval);
    downloadCSV();
  }
}
function downloadCSV() {
  if (logData.length <= 1) return;
  let csv = "data:text/csv;charset=utf-8," + logData.map(e => e.join(",")).join("\n");
  let link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", "clio_real.csv");
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

// DIBUJAR PANTALLAS
function openDisplay(type) {
  actionFeedback(600); const ov = document.getElementById('overlay'); const title = document.getElementById('ov-title'); const content = document.getElementById('ov-content'); ov.classList.add('active');

  if (type === 'temps') {
    title.innerText = "ESTADO TÉRMICO DE MOTOR (REAL)";
    content.innerHTML = `
      <div class="data-card"><label>REFRIGERANTE (ECT)</label><div class="value" id="ect-v">${obdData.ect}</div><div class="unit">°C</div></div>
      <div class="data-card"><label>ADMISIÓN (IAT)</label><div class="value" id="iat-v">${obdData.iat}</div><div class="unit">°C</div></div>
      <div class="data-card" style="grid-column:span 2"><label>ACEITE MOTOR</label><div class="value">Sin Sensor ECU</div><div class="unit">INFO</div></div>
    `;
  } else if (type === 'pressures') {
    title.innerText = "MONITOR DE PRESIONES (REAL)";
    content.innerHTML = `
      <div class="data-card"><label>TURBO BOOST REL.</label><div class="value" id="boost-v">${obdData.boost}</div><div class="unit">BAR</div></div>
      <div class="data-card"><label>MAP ABSOLUTO</label><div class="value" id="map-v">${obdData.map}</div><div class="unit">kPa</div></div>
    `;
  } else if (type === 'gforces') {
    title.innerText = "DINÁMICA (SENSORES IPHONE)";
    content.innerHTML = `
      <div class="data-card"><label>ACEL. LATERAL</label><div class="value" id="g-lat">${currentGLat}</div><div class="unit">G</div></div>
      <div class="data-card"><label>ACEL. LONGITUDINAL</label><div class="value" id="g-long">${currentGLong}</div><div class="unit">G</div></div>
      <div class="data-card" style="grid-column:span 2"><label>PICO MÁXIMO G</label><div class="value" id="g-max">${maxG}</div><div class="unit">G</div></div>
    `;
  } else if (type === 'faults') {
    title.innerText = "ESTADO ECU & OBD2";
    content.innerHTML = `
      <div class="data-card" style="grid-column:span 2"><label>ESTADO CONEXIÓN BLUETOOTH</label><div class="value" style="color:var(--c-green)">${isConnected ? 'ENLAZADO' : 'DESCONECTADO'}</div><div class="unit">GATT</div></div>
    `;
  } else if (type === 'stats') {
    title.innerText = "RESUMEN TELEMETRÍA";
    content.innerHTML = `
      <div class="data-card"><label>VELOCIDAD ECU</label><div class="value">${obdData.speed}</div><div class="unit">KM/H</div></div>
      <div class="data-card"><label>PUNTOS GUARDADOS</label><div class="value">${Math.max(0, logData.length - 1)}</div><div class="unit">MUESTRAS</div></div>
    `;
  } else if (type === 'settings') {
    title.innerText = "AJUSTES";
    content.innerHTML = `<div class="setting-row"><span>TEMA VISUAL</span><button class="setting-btn active" onclick="toggleTheme()">CAMBIAR COLOR</button></div>`;
  }
}
function closeDisplay() { actionFeedback(400); document.getElementById('overlay').classList.remove('active'); }
function dismissAlarm() { actionFeedback(500); document.getElementById('global-alarm').style.display = 'none'; }
function toggleTheme() { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; actionFeedback(700); if (settings.theme === 'light') document.body.classList.add('light-theme'); else document.body.classList.remove('light-theme'); openDisplay('settings'); }
</script>
</body>
</html>
